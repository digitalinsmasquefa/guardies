// ---------- Storage helpers (Google Sheets backend via Apps Script) ----------
// 1) Deploy the accompanying Apps Script as a Web App ("Anyone" access).
// 2) Paste the resulting /exec URL below, replacing the placeholder.
const API_URL = "https://script.google.com/macros/s/AKfycbxJlBLMGBPtIKfMtT_z3E0NUVKuW32YhQCKECrvYBTrAXvug1hExi9YIcf3grNsVAXm/exec";

async function safeGet(key){
  try{
    const res = await fetch(`${API_URL}?action=get&key=${encodeURIComponent(key)}`);
    if(!res.ok) return null;
    const data = await res.json();
    return (data && data.value !== undefined) ? data.value : null;
  }catch(e){ console.error("storage.get failed", key, e); return null; }
}
async function safeSet(key, value){
  try{
    await fetch(API_URL, {
      method: "POST",
      headers: {"Content-Type": "text/plain;charset=utf-8"}, // avoids CORS preflight on Apps Script
      body: JSON.stringify({action:"set", key, value})
    });
    return true;
  }catch(e){ console.error("storage.set failed", key, e); return false; }
}
async function safeDelete(key){
  try{
    await fetch(API_URL, {
      method: "POST",
      headers: {"Content-Type": "text/plain;charset=utf-8"},
      body: JSON.stringify({action:"delete", key})
    });
    return true;
  }catch(e){ console.error("storage.delete failed", key, e); return false; }
}

function recordKey(dateStr, slotId){ return `record:${dateStr}:${slotId}`; }

// ---------- Date helpers ----------
function pad(n){ return String(n).padStart(2,"0"); }
function toISO(d){ return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; }
function getMonday(date){
  const d = new Date(date);
  const day = d.getDay();
  const diff = (day===0? -6 : 1) - day;
  d.setDate(d.getDate()+diff);
  d.setHours(0,0,0,0);
  return d;
}
function addDays(d, n){ const r=new Date(d); r.setDate(r.getDate()+n); return r; }
function fmtDateHuman(d){
  const dw = ["Diumenge","Dilluns","Dimarts","Dimecres","Dijous","Divendres","Dissabte"][d.getDay()];
  return `${dw} ${d.getDate()}/${d.getMonth()+1}/${d.getFullYear()}`;
}
function weekLabel(monday){
  const friday = addDays(monday,4);
  return `${monday.getDate()}/${monday.getMonth()+1} – ${friday.getDate()}/${friday.getMonth()+1}/${friday.getFullYear()}`;
}

// ---------- App state ----------
const state = {
  template: null,
  totals: null,
  tab: "ara",
  ara: { monday: null, dayIdx: 0, slotId: null, absent: 0, assignments: null, hasRecord:false, savedFlag:false },
  hist: { monday: null },
  cfg: { draft: null }
};

function referenceMonday(){
  const now = new Date();
  const day = now.getDay();
  let d = new Date(now);
  if(day===0) d.setDate(d.getDate()+1);
  else if(day===6) d.setDate(d.getDate()+2);
  return getMonday(d);
}

function detectNow(){
  const now = new Date();
  const day = now.getDay();
  const monday = referenceMonday();
  let dayIdx = 0, slotId = SLOTS[0].id;
  if(day>=1 && day<=5){
    dayIdx = day-1;
    const hhmm = pad(now.getHours())+":"+pad(now.getMinutes());
    let found = SLOTS.find(s=> hhmm>=s.id && hhmm<s.end);
    if(!found){
      if(hhmm < SLOTS[0].id) found = SLOTS[0];
      else if(hhmm >= SLOTS[SLOTS.length-1].end) found = SLOTS[SLOTS.length-1];
      else found = SLOTS.find(s=> hhmm < s.id) || SLOTS[SLOTS.length-1];
    }
    slotId = found.id;
  }
  return {monday, dayIdx, slotId};
}

function ensureTeacher(totals, name){
  if(!totals[name]) totals[name] = {guardia:0, sala:0, passadis:0};
  return totals[name];
}

function poolFor(dayIdx, slotId){
  const code = DAY_CODES[dayIdx];
  const day = state.template[code] || {};
  return day[slotId] || [];
}

function proposeAssignment(pool, absent, totals){
  const N = pool.length;
  const guardiaCount = Math.min(Math.max(absent,0), N);
  const remaining = N - guardiaCount;
  const salaCount = Math.ceil(remaining/2);
  const passadisCount = remaining - salaCount;

  let available = pool.slice();
  const hrs = (name, cat) => (totals[name] && totals[name][cat]) || 0;
  function pickLowest(list, cat, count){
    const sorted = list.slice().sort((a,b)=> (hrs(a,cat)-hrs(b,cat)) || a.localeCompare(b,'ca'));
    return sorted.slice(0,count);
  }
  const g = pickLowest(available, 'guardia', guardiaCount);
  available = available.filter(n=>!g.includes(n));
  const s = pickLowest(available, 'sala', salaCount);
  available = available.filter(n=>!s.includes(n));
  const p = available;

  const assignments = {};
  g.forEach(n=>assignments[n]='guardia');
  s.forEach(n=>assignments[n]='sala');
  p.forEach(n=>assignments[n]='passadis');
  return {assignments, counts:{guardia:guardiaCount, sala:salaCount, passadis:passadisCount}};
}

async function loadRecord(dateStr, slotId){
  const raw = await safeGet(recordKey(dateStr, slotId));
  if(!raw) return null;
  try{ return JSON.parse(raw); }catch(e){ return null; }
}

async function saveRecord(dateStr, dayIdx, slotId, absent, assignments){
  const key = recordKey(dateStr, slotId);
  const old = await loadRecord(dateStr, slotId);
  const totals = state.totals;
  if(old && old.assignments){
    for(const [name, task] of Object.entries(old.assignments)){
      const t = ensureTeacher(totals, name);
      if(t[task]!==undefined) t[task] = Math.max(0, t[task]-1);
    }
  }
  for(const [name, task] of Object.entries(assignments)){
    const t = ensureTeacher(totals, name);
    t[task] = (t[task]||0) + 1;
  }
  await safeSet('totals', JSON.stringify(totals));
  await safeSet(key, JSON.stringify({
    date: dateStr, day: DAY_CODES[dayIdx], slot: slotId, absent, assignments, updatedAt: Date.now()
  }));
}

async function deleteRecord(dateStr, slotId){
  const old = await loadRecord(dateStr, slotId);
  if(!old) return;
  const totals = state.totals;
  for(const [name, task] of Object.entries(old.assignments||{})){
    const t = ensureTeacher(totals, name);
    if(t[task]!==undefined) t[task] = Math.max(0, t[task]-1);
  }
  await safeSet('totals', JSON.stringify(totals));
  await safeDelete(recordKey(dateStr, slotId));
}

// ---------- Init ----------
async function init(){
  if(!API_URL || API_URL.indexOf("REPLACE_WITH") === 0){
    document.getElementById('loading').style.display = 'none';
    const warn = document.getElementById('api-warning');
    // Render the shell so the warning banner has somewhere to live.
    state.template = JSON.parse(JSON.stringify(DEFAULT_TEMPLATE));
    state.totals = {};
    const d = detectNow();
    state.ara.monday = d.monday; state.ara.dayIdx = d.dayIdx; state.ara.slotId = d.slotId;
    state.hist.monday = d.monday;
    render();
    document.getElementById('api-warning').style.display = 'block';
    return;
  }
  let tRaw = await safeGet('template');
  if(!tRaw){
    state.template = DEFAULT_TEMPLATE;
    await safeSet('template', JSON.stringify(DEFAULT_TEMPLATE));
  } else {
    try{ state.template = JSON.parse(tRaw); }catch(e){ state.template = DEFAULT_TEMPLATE; }
  }
  let totRaw = await safeGet('totals');
  if(!totRaw){ state.totals = {}; await safeSet('totals', JSON.stringify({})); }
  else { try{ state.totals = JSON.parse(totRaw); }catch(e){ state.totals = {}; } }

  const d = detectNow();
  state.ara.monday = d.monday;
  state.ara.dayIdx = d.dayIdx;
  state.ara.slotId = d.slotId;
  state.hist.monday = d.monday;

  render();
  await refreshAraRecord();
}

function updateClock(){
  const c = document.getElementById('clockline');
  if(!c) return;
  const now = new Date();
  c.textContent = `${fmtDateHuman(now)} · ${pad(now.getHours())}:${pad(now.getMinutes())}`;
}

// ----- Tab: Ara -----
function araDate(){ return addDays(state.ara.monday, state.ara.dayIdx); }

function renderAra(){
  const panel = document.getElementById('panel-ara');
  const monday = state.ara.monday;
  const dateStr = toISO(araDate());
  const pool = poolFor(state.ara.dayIdx, state.ara.slotId);

  let dayOptions = DAY_CODES.map((c,i)=>{
    const dd = addDays(monday, i);
    return `<option value="${i}" ${i===state.ara.dayIdx?'selected':''}>${DAY_FULL[c]} ${dd.getDate()}/${dd.getMonth()+1}</option>`;
  }).join('');
  let slotOptions = SLOTS.map(s=>`<option value="${s.id}" ${s.id===state.ara.slotId?'selected':''}>${s.label}</option>`).join('');

  panel.innerHTML = `
    <div class="week-nav">
      <button class="btn secondary" id="ara-prevweek">◀ Setmana anterior</button>
      <span class="weeklabel">Setmana del ${weekLabel(monday)}</span>
      <button class="btn secondary" id="ara-nextweek">Setmana següent ▶</button>
    </div>
    <div class="card">
      <div class="row slot-picker">
        <div class="field"><label>Dia</label>
          <select id="ara-day">${dayOptions}</select>
        </div>
        <div class="field"><label>Franja horària</label>
          <select id="ara-slot">${slotOptions}</select>
        </div>
      </div>
      <div id="ara-body">Carregant…</div>
    </div>
  `;
  panel.querySelector('#ara-prevweek').addEventListener('click', ()=>{ state.ara.monday = addDays(state.ara.monday,-7); renderAra(); refreshAraRecord(); });
  panel.querySelector('#ara-nextweek').addEventListener('click', ()=>{ state.ara.monday = addDays(state.ara.monday,7); renderAra(); refreshAraRecord(); });
  panel.querySelector('#ara-day').addEventListener('change', (e)=>{ state.ara.dayIdx = parseInt(e.target.value,10); renderAra(); refreshAraRecord(); });
  panel.querySelector('#ara-slot').addEventListener('change', (e)=>{ state.ara.slotId = e.target.value; renderAra(); refreshAraRecord(); });

  renderAraBody(pool, dateStr);
}

async function refreshAraRecord(){
  const dateStr = toISO(araDate());
  const rec = await loadRecord(dateStr, state.ara.slotId);
  if(rec){
    state.ara.hasRecord = true;
    state.ara.absent = rec.absent;
    state.ara.assignments = rec.assignments;
  } else {
    state.ara.hasRecord = false;
    state.ara.absent = 0;
    state.ara.assignments = null;
  }
  const pool = poolFor(state.ara.dayIdx, state.ara.slotId);
  renderAraBody(pool, dateStr);
}

function effectiveTotalsExcluding(dateStr, slotId, currentRecord){
  const totals = JSON.parse(JSON.stringify(state.totals));
  if(currentRecord && currentRecord.assignments){
    for(const [name, task] of Object.entries(currentRecord.assignments)){
      const t = ensureTeacher(totals, name);
      if(t[task]!==undefined) t[task] = Math.max(0, t[task]-1);
    }
  }
  return totals;
}

function renderAraBody(pool, dateStr){
  const body = document.getElementById('ara-body');
  if(!body) return;
  if(pool.length===0){
    body.innerHTML = `<p class="pool-empty">No hi ha cap grup de guàrdia assignat aquest dia/franja. Comprova la pestanya «Configuració».</p>`;
    return;
  }
  const assignments = state.ara.assignments || {};
  body.innerHTML = `
    <div class="row" style="margin-top:6px;">
      <div class="field"><label>Professors que falten a cobrir</label>
        <input type="number" id="ara-absent" min="0" max="${pool.length}" value="${state.ara.absent||0}" style="width:80px;">
      </div>
      <button class="btn secondary" id="ara-propose">Proposar distribució</button>
      ${state.ara.hasRecord ? '<span class="tag guardia" style="align-self:center;">Ja registrada — pots editar-la</span>' : ''}
    </div>
    <div id="ara-table-wrap"></div>
    <div class="row" style="margin-top:14px;">
      <button class="btn" id="ara-save">${state.ara.hasRecord? 'Actualitzar guàrdia' : 'Desar guàrdia'}</button>
      ${state.ara.hasRecord ? '<button class="btn danger" id="ara-delete">Esborrar registre</button>' : ''}
      <span class="saved-flag" id="ara-savedflag"></span>
    </div>
  `;
  document.getElementById('ara-propose').addEventListener('click', async ()=>{
    const absentVal = parseInt(document.getElementById('ara-absent').value,10) || 0;
    state.ara.absent = absentVal;
    const rec = state.ara.hasRecord ? {assignments: assignments} : null;
    const totals = effectiveTotalsExcluding(dateStr, state.ara.slotId, rec);
    const {assignments: newAssign, counts} = proposeAssignment(pool, absentVal, totals);
    state.ara.assignments = newAssign;
    renderAssignTable(pool, newAssign, totals, counts);
  });
  document.getElementById('ara-save').addEventListener('click', async ()=>{
    const wrap = document.getElementById('ara-table-wrap');
    if(!wrap.querySelector('select')){
      alert('Primer genera o carrega una proposta de distribució.');
      return;
    }
    const finalAssign = {};
    wrap.querySelectorAll('select.taskpick').forEach(sel=>{
      finalAssign[sel.dataset.name] = sel.value;
    });
    const absentVal = parseInt(document.getElementById('ara-absent').value,10) || 0;
    await saveRecord(dateStr, state.ara.dayIdx, state.ara.slotId, absentVal, finalAssign);
    state.ara.hasRecord = true;
    state.ara.assignments = finalAssign;
    state.ara.absent = absentVal;
    document.getElementById('ara-savedflag').textContent = 'Desat ✓';
    renderAra();
  });
  const delBtn = document.getElementById('ara-delete');
  if(delBtn){
    delBtn.addEventListener('click', async ()=>{
      if(!confirm('Vols esborrar aquest registre? Es descomptaran les hores dels professors implicats.')) return;
      await deleteRecord(dateStr, state.ara.slotId);
      state.ara.hasRecord = false;
      state.ara.assignments = null;
      state.ara.absent = 0;
      renderAra();
    });
  }

  if(state.ara.hasRecord && assignments){
    const totals = effectiveTotalsExcluding(dateStr, state.ara.slotId, {assignments});
    const counts = {guardia:0, sala:0, passadis:0};
    Object.values(assignments).forEach(t=>counts[t]=(counts[t]||0)+1);
    renderAssignTable(pool, assignments, totals, counts);
  }
}

function renderAssignTable(pool, assignments, totalsForDisplay, counts){
  const wrap = document.getElementById('ara-table-wrap');
  if(!wrap) return;
  wrap.innerHTML = `
    <div class="counts">Repartiment proposat — <b>Guàrdia: ${counts.guardia}</b> · <b>Sala: ${counts.sala}</b> · <b>Passadís: ${counts.passadis}</b></div>
    <table class="assign">
      <tr><th>Professor</th><th>Hores acumulades (G / S / P)</th><th>Tasca</th></tr>
      ${pool.map(name=>{
        const t = totalsForDisplay[name] || {guardia:0,sala:0,passadis:0};
        const val = assignments[name] || 'passadis';
        return `<tr>
          <td>${name}</td>
          <td class="hrs">${t.guardia} / ${t.sala} / ${t.passadis}</td>
          <td>
            <select class="taskpick ${val}" data-name="${name}" onchange="this.className='taskpick '+this.value">
              <option value="guardia" ${val==='guardia'?'selected':''}>Guàrdia</option>
              <option value="sala" ${val==='sala'?'selected':''}>Sala de professors</option>
              <option value="passadis" ${val==='passadis'?'selected':''}>Passadís</option>
            </select>
          </td>
        </tr>`;
      }).join('')}
    </table>
  `;
}

// ----- Tab: Historial -----
async function renderHist(){
  const panel = document.getElementById('panel-hist');
  const monday = state.hist.monday;
  panel.innerHTML = `
    <div class="week-nav">
      <button class="btn secondary" id="hist-prevweek">◀ Setmana anterior</button>
      <span class="weeklabel">Setmana del ${weekLabel(monday)}</span>
      <button class="btn secondary" id="hist-nextweek">Setmana següent ▶</button>
    </div>
    <div class="card" id="hist-tablewrap"><div class="loading">Carregant…</div></div>
  `;
  panel.querySelector('#hist-prevweek').addEventListener('click', ()=>{ state.hist.monday = addDays(state.hist.monday,-7); renderHist(); });
  panel.querySelector('#hist-nextweek').addEventListener('click', ()=>{ state.hist.monday = addDays(state.hist.monday,7); renderHist(); });

  const days = DAY_CODES.map((c,i)=>({code:c, date: addDays(monday,i)}));
  const records = {};
  for(const s of SLOTS){
    records[s.id] = {};
    for(const d of days){
      records[s.id][d.code] = await loadRecord(toISO(d.date), s.id);
    }
  }

  const wrap = document.getElementById('hist-tablewrap');
  wrap.innerHTML = `
    <table class="hist">
      <tr><th>Hora</th>${days.map(d=>`<th>${DAY_FULL[d.code]}<br>${d.date.getDate()}/${d.date.getMonth()+1}</th>`).join('')}</tr>
      ${SLOTS.map(s=>`
        <tr>
          <td class="timecell">${s.label}</td>
          ${days.map(d=>{
            const rec = records[s.id][d.code];
            const dstr = toISO(d.date);
            if(!rec){
              return `<td class="daycell empty-cell" data-date="${dstr}" data-day="${d.code}" data-slot="${s.id}">— sense registrar</td>`;
            }
            const lines = Object.entries(rec.assignments).map(([n,t])=>`<div class="entry">${n} <span class="tag ${t}">${TASK_LABEL[t]}</span></div>`).join('');
            return `<td class="daycell" data-date="${dstr}" data-day="${d.code}" data-slot="${s.id}">${lines}</td>`;
          }).join('')}
        </tr>
      `).join('')}
    </table>
  `;
  wrap.querySelectorAll('td.daycell').forEach(td=>{
    td.addEventListener('click', ()=>{
      const dstr = td.dataset.date;
      const dayCode = td.dataset.day;
      const slotId = td.dataset.slot;
      const dayIdx = DAY_CODES.indexOf(dayCode);
      const d = new Date(dstr+'T00:00:00');
      state.ara.monday = getMonday(d);
      state.ara.dayIdx = dayIdx;
      state.ara.slotId = slotId;
      state.tab = 'ara';
      render();
      refreshAraRecord();
    });
  });
}

// ----- Tab: Totals -----
function renderTotals(){
  const panel = document.getElementById('panel-totals');
  const totals = state.totals || {};
  let rows = Object.entries(totals).map(([name,t])=>{
    const tot = t.guardia+t.sala+t.passadis;
    const mx = Math.max(t.guardia,t.sala,t.passadis);
    const mn = Math.min(t.guardia,t.sala,t.passadis);
    return {name, ...t, total: tot, desequilibri: mx-mn};
  });
  rows.sort((a,b)=> b.desequilibri - a.desequilibri || a.name.localeCompare(b.name,'ca'));

  panel.innerHTML = `
    <div class="card">
      ${rows.length===0? '<p class="pool-empty">Encara no hi ha cap guàrdia registrada.</p>' : `
      <table class="totals">
        <tr><th>Professor</th><th>Guàrdia</th><th>Sala</th><th>Passadís</th><th>Total h</th><th>Desequilibri</th></tr>
        ${rows.map(r=>`
          <tr>
            <td>${r.name}</td>
            <td>${r.guardia}</td>
            <td>${r.sala}</td>
            <td>${r.passadis}</td>
            <td>${r.total}</td>
            <td>${r.desequilibri}</td>
          </tr>
        `).join('')}
      </table>`}
    </div>
  `;
}

// ----- Tab: Configuració -----
function renderConfig(){
  const panel = document.getElementById('panel-cfg');
  if(!state.cfg.draft) state.cfg.draft = JSON.parse(JSON.stringify(state.template));
  const draft = state.cfg.draft;
  panel.innerHTML = `
    <div class="card">
      <p style="font-size:13px;color:#5a5346;">Edita els professors assignats a cada dia i franja (separats per comes). Els canvis només afecten guàrdies futures que encara no s'hagin proposat.</p>
      <table class="cfg">
        <tr><th>Hora</th>${DAY_CODES.map(c=>`<th>${DAY_FULL[c]}</th>`).join('')}</tr>
        ${SLOTS.map(s=>`
          <tr>
            <td class="slotcell">${s.label}</td>
            ${DAY_CODES.map(c=>`<td><textarea data-day="${c}" data-slot="${s.id}">${(draft[c]&&draft[c][s.id]||[]).join(', ')}</textarea></td>`).join('')}
          </tr>
        `).join('')}
      </table>
      <div class="row" style="margin-top:14px;">
        <button class="btn" id="cfg-save">Desar plantilla</button>
        <button class="btn secondary" id="cfg-reset">Restaurar plantilla original</button>
        <span class="saved-flag" id="cfg-savedflag"></span>
      </div>
    </div>
  `;
  panel.querySelector('#cfg-save').addEventListener('click', async ()=>{
    const newTemplate = {};
    DAY_CODES.forEach(c=> newTemplate[c] = {});
    panel.querySelectorAll('textarea').forEach(ta=>{
      const names = ta.value.split(',').map(s=>s.trim()).filter(Boolean);
      newTemplate[ta.dataset.day][ta.dataset.slot] = names;
    });
    state.template = newTemplate;
    state.cfg.draft = JSON.parse(JSON.stringify(newTemplate));
    await safeSet('template', JSON.stringify(newTemplate));
    document.getElementById('cfg-savedflag').textContent = 'Desat ✓';
  });
  panel.querySelector('#cfg-reset').addEventListener('click', async ()=>{
    if(!confirm('Vols restaurar la plantilla original del curs? Es perdran els canvis manuals fets a la configuració.')) return;
    state.template = JSON.parse(JSON.stringify(DEFAULT_TEMPLATE));
    state.cfg.draft = JSON.parse(JSON.stringify(DEFAULT_TEMPLATE));
    await safeSet('template', JSON.stringify(state.template));
    renderConfig();
  });
}

init();
setInterval(updateClock, 30000);
})();
</script>

// ---------- Storage helpers (Google Sheets backend via Apps Script) ----------
// 1) Deploy the accompanying Apps Script as a Web App ("Anyone" access).
// 2) Paste the resulting /exec URL below, replacing the placeholder.
const API_URL = "https://script.google.com/macros/s/AKfycbxJlBLMGBPtIKfMtT_z3E0NUVKuW32YhQCKECrvYBTrAXvug1hExi9YIcf3grNsVAXm/exec";
// Ha de coincidir exactament amb SECRET_TOKEN de l'Apps Script.
const SECRET_TOKEN = "CANVIA_AQUEST_TOKEN_2026";

async function safeGet(key){
  try{
    const res = await fetchWithTimeout(`${API_URL}?action=get&key=${encodeURIComponent(key)}`);
    if(!res.ok) return null;
    const data = await res.json();
    return (data && data.value !== undefined) ? data.value : null;
  }catch(e){ console.error("storage.get failed", key, e); return null; }
}
async function safeSet(key, value){
  try{
    await fetchWithTimeout(API_URL, {
      method: "POST",
      headers: {"Content-Type": "text/plain;charset=utf-8"}, // avoids CORS preflight on Apps Script
      body: JSON.stringify({action:"set", key, value, token: SECRET_TOKEN})
    });
    return true;
  }catch(e){ console.error("storage.set failed", key, e); return false; }
}
async function safeDelete(key){
  try{
    await fetchWithTimeout(API_URL, {
      method: "POST",
      headers: {"Content-Type": "text/plain;charset=utf-8"},
      body: JSON.stringify({action:"delete", key, token: SECRET_TOKEN})
    });
    return true;
  }catch(e){ console.error("storage.delete failed", key, e); return false; }
}
function fetchWithTimeout(url, opts, ms){
  ms = ms || 10000;
  const controller = new AbortController();
  const id = setTimeout(()=>controller.abort(), ms);
  return fetch(url, Object.assign({}, opts, {signal: controller.signal})).finally(()=>clearTimeout(id));
}

function recordKey(dateStr, slotId){ return `record:${dateStr}:${slotId}`; }

// ---------- Date helpers ----------
function pad(n){ return String(n).padStart(2,"0"); }
function toISO(d){ return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; }
function getMonday(date){
  const d = new Date(date);
  const day = d.getDay();
  const diff = (day===0? -6 : 1) - day;
  d.setDate(d.getDate()+diff);
  d.setHours(0,0,0,0);
  return d;
}
function addDays(d, n){ const r=new Date(d); r.setDate(r.getDate()+n); return r; }
function fmtDateHuman(d){
  const dw = ["Diumenge","Dilluns","Dimarts","Dimecres","Dijous","Divendres","Dissabte"][d.getDay()];
  return `${dw} ${d.getDate()}/${d.getMonth()+1}/${d.getFullYear()}`;
}
function weekLabel(monday){
  const friday = addDays(monday,4);
  return `${monday.getDate()}/${monday.getMonth()+1} – ${friday.getDate()}/${friday.getMonth()+1}/${friday.getFullYear()}`;
}

// ---------- App state ----------
const state = {
  template: null,
  totals: null,
  tab: "ara",
  ara: { monday: null, dayIdx: 0, slotId: null, absent: 0, assignments: null, hasRecord:false, savedFlag:false, halfMode:false, present:{} },
  hist: { monday: null },
  cfg: { draft: null }
};

function referenceMonday(){
  const now = new Date();
  const day = now.getDay();
  let d = new Date(now);
  if(day===0) d.setDate(d.getDate()+1);
  else if(day===6) d.setDate(d.getDate()+2);
  return getMonday(d);
}

function detectNow(){
  const now = new Date();
  const day = now.getDay();
  const monday = referenceMonday();
  let dayIdx = 0, slotId = SLOTS[0].id;
  if(day>=1 && day<=5){
    dayIdx = day-1;
    const hhmm = pad(now.getHours())+":"+pad(now.getMinutes());
    let found = SLOTS.find(s=> hhmm>=s.id && hhmm<s.end);
    if(!found){
      if(hhmm < SLOTS[0].id) found = SLOTS[0];
      else if(hhmm >= SLOTS[SLOTS.length-1].end) found = SLOTS[SLOTS.length-1];
      else found = SLOTS.find(s=> hhmm < s.id) || SLOTS[SLOTS.length-1];
    }
    slotId = found.id;
  }
  return {monday, dayIdx, slotId};
}

function ensureTeacher(totals, name){
  if(!totals[name]) totals[name] = {guardia:0, sala:0, passadis:0};
  return totals[name];
}

function poolFor(dayIdx, slotId){
  const code = DAY_CODES[dayIdx];
  const day = state.template[code] || {};
  return day[slotId] || [];
}

function proposeAssignment(pool, absent, totals){
  const N = pool.length;
  const guardiaCount = Math.min(Math.max(absent,0), N);
  const remaining = N - guardiaCount;
  const salaCount = Math.ceil(remaining/2);
  const passadisCount = remaining - salaCount;

  let available = pool.slice();
  const hrs = (name, cat) => (totals[name] && totals[name][cat]) || 0;
  // Ranking per PERCENTATGE propi de cada professor (no hores absolutes): així algú
  // que ha estat de baixa i té poques hores acumulades de tot plegat no queda
  // sempre primer de la cua — es compara la seva pròpia distribució relativa
  // entre guàrdia/sala/passadís, no la seva magnitud absoluta.
  function pct(name, cat){
    const t = totals[name] || {guardia:0, sala:0, passadis:0};
    const total = (t.guardia||0)+(t.sala||0)+(t.passadis||0);
    if(total <= 0) return 0;
    return (t[cat]||0) / total;
  }
  function pickLowest(list, cat, count){
    const sorted = list.slice().sort((a,b)=>{
      const pa = pct(a,cat), pb = pct(b,cat);
      if(pa !== pb) return pa - pb;
      const ha = hrs(a,cat), hb = hrs(b,cat);
      if(ha !== hb) return ha - hb;
      return a.localeCompare(b,'ca');
    });
    return sorted.slice(0,count);
  }
  const g = pickLowest(available, 'guardia', guardiaCount);
  available = available.filter(n=>!g.includes(n));
  const s = pickLowest(available, 'sala', salaCount);
  available = available.filter(n=>!s.includes(n));
  const p = available;

  const assignments = {};
  g.forEach(n=>assignments[n]='guardia');
  s.forEach(n=>assignments[n]='sala');
  p.forEach(n=>assignments[n]='passadis');
  return {assignments, counts:{guardia:guardiaCount, sala:salaCount, passadis:passadisCount}};
}

// Two independent rounds (first/second half hour), rebalancing between them
// so the same teacher can land in a different task each half.
function proposeHalfHourAssignment(pool, absent, totals){
  const working = JSON.parse(JSON.stringify(totals));
  const round1 = proposeAssignment(pool, absent, working);
  Object.entries(round1.assignments).forEach(([name, task])=>{
    const t = ensureTeacher(working, name);
    t[task] = (t[task]||0) + 0.5;
  });
  const round2 = proposeAssignment(pool, absent, working);
  const assignments = {};
  pool.forEach(name=>{ assignments[name] = {a: round1.assignments[name], b: round2.assignments[name]}; });
  return {assignments, counts1: round1.counts, counts2: round2.counts};
}

async function loadRecord(dateStr, slotId){
  const raw = await safeGet(recordKey(dateStr, slotId));
  if(!raw) return null;
  try{ return JSON.parse(raw); }catch(e){ return null; }
}

async function loadRecordsBulk(keys){
  // Una sola petició per a totes les claus demanades (p.ex. les 30 franges
  // d'una setmana), en lloc d'una petició per clau.
  const out = {};
  try{
    const res = await fetchWithTimeout(`${API_URL}?action=multiGet&keys=${encodeURIComponent(keys.join(','))}`);
    if(res.ok){
      const data = await res.json();
      const values = (data && data.values) || {};
      keys.forEach(k=>{
        const raw = values[k];
        if(!raw){ out[k] = null; return; }
        try{ out[k] = JSON.parse(raw); }catch(e){ out[k] = null; }
      });
      return out;
    }
  }catch(e){ console.error("multiGet failed, falling back to one-by-one", e); }
  // Si el backend no té encara l'acció multiGet (Apps Script no actualitzat),
  // recorrem a demanar-les una a una perquè l'Historial continuï funcionant.
  for(const k of keys){
    const raw = await safeGet(k);
    out[k] = raw ? (()=>{ try{ return JSON.parse(raw); }catch(e){ return null; } })() : null;
  }
  return out;
}

function applyRecordToTotals(totals, record, sign){
  // sign: +1 to add, -1 to remove
  if(!record || !record.assignments) return;
  if(record.half){
    for(const [name, parts] of Object.entries(record.assignments)){
      const t = ensureTeacher(totals, name);
      const ba = bucketFor(parts.a), bb = bucketFor(parts.b);
      if(ba) t[ba] = Math.max(0, (t[ba]||0) + sign*0.5);
      if(bb) t[bb] = Math.max(0, (t[bb]||0) + sign*0.5);
    }
  } else {
    for(const [name, task] of Object.entries(record.assignments)){
      const b = bucketFor(task);
      if(!b) continue;
      const t = ensureTeacher(totals, name);
      t[b] = Math.max(0, (t[b]||0) + sign*1);
    }
  }
}

async function saveRecord(dateStr, dayIdx, slotId, absent, assignments, half){
  const key = recordKey(dateStr, slotId);
  const old = await loadRecord(dateStr, slotId);
  const totals = state.totals;
  if(old) applyRecordToTotals(totals, old, -1);
  applyRecordToTotals(totals, {assignments, half}, +1);
  await safeSet('totals', JSON.stringify(totals));
  await safeSet(key, JSON.stringify({
    date: dateStr, day: DAY_CODES[dayIdx], slot: slotId, absent, half: !!half, assignments, updatedAt: Date.now()
  }));
}

async function deleteRecord(dateStr, slotId){
  const old = await loadRecord(dateStr, slotId);
  if(!old) return;
  const totals = state.totals;
  applyRecordToTotals(totals, old, -1);
  await safeSet('totals', JSON.stringify(totals));
  await safeDelete(recordKey(dateStr, slotId));
}

// ---------- Init ----------
async function init(){
  if(!API_URL || API_URL.indexOf("REPLACE_WITH") === 0){
    state.template = JSON.parse(JSON.stringify(DEFAULT_TEMPLATE));
    state.totals = {};
    const d = detectNow();
    state.ara.monday = d.monday; state.ara.dayIdx = d.dayIdx; state.ara.slotId = d.slotId;
    state.hist.monday = d.monday;
    render();
    document.getElementById('api-warning').style.display = 'block';
    return;
  }
  try{
    let tRaw = await safeGet('template');
    if(!tRaw){
      state.template = DEFAULT_TEMPLATE;
      await safeSet('template', JSON.stringify(DEFAULT_TEMPLATE));
    } else {
      try{ state.template = JSON.parse(tRaw); }catch(e){ state.template = DEFAULT_TEMPLATE; }
    }
    let totRaw = await safeGet('totals');
    if(!totRaw){ state.totals = {}; await safeSet('totals', JSON.stringify({})); }
    else { try{ state.totals = JSON.parse(totRaw); }catch(e){ state.totals = {}; } }

    const d = detectNow();
    state.ara.monday = d.monday;
    state.ara.dayIdx = d.dayIdx;
    state.ara.slotId = d.slotId;
    state.hist.monday = d.monday;

    render();
    await refreshAraRecord();
  }catch(err){
    // Encara que alguna cosa falli inesperadament, no ens quedem a "Carregant…":
    // pintem l'app amb la plantilla per defecte i avisem que no s'ha pogut connectar.
    console.error("init() failed", err);
    state.template = state.template || JSON.parse(JSON.stringify(DEFAULT_TEMPLATE));
    state.totals = state.totals || {};
    if(!state.ara.monday){
      const d = detectNow();
      state.ara.monday = d.monday; state.ara.dayIdx = d.dayIdx; state.ara.slotId = d.slotId;
      state.hist.monday = d.monday;
    }
    render();
    const warn = document.getElementById('api-warning');
    if(warn){
      warn.textContent = "No s'ha pogut connectar amb Google Sheets. Comprova la connexió a internet i que la URL d'Apps Script (API_URL) sigui correcta i estigui desplegada amb accés \"Qualsevol\".";
      warn.style.display = 'block';
    }
  }
}

function renderAra(){

  panel.querySelector('#ara-slot').addEventListener('change', (e)=>{ state.ara.slotId = e.target.value; renderAra(); refreshAraRecord(); });

async function refreshAraRecord(){
  const dateStr = toISO(araDate());
  const rec = await loadRecord(dateStr, state.ara.slotId);
  const pool = poolFor(state.ara.dayIdx, state.ara.slotId);
  state.ara.present = {};
  pool.forEach(n=> state.ara.present[n] = true);
  if(rec){
    state.ara.hasRecord = true;
    state.ara.absent = rec.absent;
    state.ara.assignments = rec.assignments;
    state.ara.halfMode = !!rec.half;
    if(!rec.half){
      Object.entries(rec.assignments||{}).forEach(([n,t])=>{ if(t==='absent') state.ara.present[n] = false; });
    }
  } else {
    state.ara.hasRecord = false;
    state.ara.absent = 0;
    state.ara.assignments = null;
    state.ara.halfMode = false;
  }
  renderAraBody(pool, dateStr);
}

function effectiveTotalsExcluding(dateStr, slotId, currentRecord){
  const totals = JSON.parse(JSON.stringify(state.totals));
  applyRecordToTotals(totals, currentRecord, -1);
  return totals;
}

function renderAraBody(pool, dateStr){
  const body = document.getElementById('ara-body');
  if(!body) return;
  if(pool.length===0){
    body.innerHTML = `<p class="pool-empty">No hi ha cap grup de guàrdia assignat aquest dia/franja. Comprova la pestanya «Configuració».</p>`;
    return;
  }
  const assignments = state.ara.assignments || {};
  body.innerHTML = `
    <div class="row" style="margin-top:6px;">
      <div class="field"><label>Professors que falten a cobrir (a tot el centre)</label>
        <select id="ara-absent" style="width:80px;">
          ${Array.from({length:11}, (_,i)=>i).map(i=>`<option value="${i}" ${i===(state.ara.absent||0)?'selected':''}>${i}</option>`).join('')}
        </select>
      </div>
      <div class="field"><label>&nbsp;</label>
        <label style="display:flex;align-items:center;gap:6px;font-size:13.5px;font-weight:normal;">
          <input type="checkbox" id="ara-half" ${state.ara.halfMode? 'checked':''}> Distribució per mitges hores
        </label>
      </div>
      <button class="btn secondary" id="ara-propose">Proposar distribució</button>
      ${state.ara.hasRecord ? '<span class="tag guardia" style="align-self:center;">Ja registrada — pots editar-la</span>' : ''}
    </div>
    <div class="field" style="margin-top:12px;">
      <label>D'aquest grup, qui hi és avui (clica per marcar com a absent)</label>
      <div id="ara-presence" class="presence-chips">
        ${pool.map(n=>`<button type="button" class="chip ${state.ara.present[n]!==false?'on':'off'}" data-name="${n}">${n}</button>`).join('')}
      </div>
    </div>
    <div id="ara-table-wrap"></div>
    <div class="row" style="margin-top:14px;">
      <button class="btn" id="ara-save">${state.ara.hasRecord? 'Actualitzar guàrdia' : 'Desar guàrdia'}</button>
      ${state.ara.hasRecord ? '<button class="btn danger" id="ara-delete">Esborrar registre</button>' : ''}
      <span class="saved-flag" id="ara-savedflag"></span>
    </div>
  `;
  document.getElementById('ara-half').addEventListener('change', (e)=>{ state.ara.halfMode = e.target.checked; });
  document.querySelectorAll('#ara-presence .chip').forEach(chip=>{
    chip.addEventListener('click', ()=>{
      const n = chip.dataset.name;
      state.ara.present[n] = !(state.ara.present[n] !== false);
      renderAraBody(pool, dateStr);
    });
  });
  document.getElementById('ara-propose').addEventListener('click', async ()=>{
    const absentVal = parseInt(document.getElementById('ara-absent').value,10) || 0;
    const halfVal = document.getElementById('ara-half').checked;
    state.ara.absent = absentVal;
    state.ara.halfMode = halfVal;
    const effectivePool = pool.filter(n=> state.ara.present[n] !== false);
    const absentees = pool.filter(n=> state.ara.present[n] === false);
    // Exclude the record as it was originally loaded (before any mode switch) from totals,
    // so regenerating a proposal doesn't double-count the record we're editing.
    const originalHalf = state.ara.hasRecord ? state.ara._loadedHalf : undefined;
    const excludeRec = state.ara.hasRecord ? {assignments: assignments, half: originalHalf} : null;
    const totals = effectiveTotalsExcluding(dateStr, state.ara.slotId, excludeRec);
    if(halfVal){
      const {assignments: newAssign, counts1, counts2} = proposeHalfHourAssignment(effectivePool, absentVal, totals);
      absentees.forEach(n=> newAssign[n] = {a:'absent', b:'absent'});
      state.ara.assignments = newAssign;
      renderAssignTable(pool, newAssign, totals, null, true, counts1, counts2);
    } else {
      const {assignments: newAssign, counts} = proposeAssignment(effectivePool, absentVal, totals);
      absentees.forEach(n=> newAssign[n] = 'absent');
      state.ara.assignments = newAssign;
      renderAssignTable(pool, newAssign, totals, counts, false);
    }
  });
  document.getElementById('ara-save').addEventListener('click', async ()=>{
    const wrap = document.getElementById('ara-table-wrap');
    if(!wrap.querySelector('select')){
      alert('Primer genera o carrega una proposta de distribució.');
      return;
    }
    const halfVal = document.getElementById('ara-half').checked;
    const finalAssign = {};
    if(halfVal){
      wrap.querySelectorAll('tr[data-name]').forEach(tr=>{
        const name = tr.dataset.name;
        const a = tr.querySelector('select.taskpick-a').value;
        const b = tr.querySelector('select.taskpick-b').value;
        finalAssign[name] = {a, b};
      });
    } else {
      wrap.querySelectorAll('select.taskpick').forEach(sel=>{
        finalAssign[sel.dataset.name] = sel.value;
      });
    }
    const absentVal = parseInt(document.getElementById('ara-absent').value,10) || 0;
    await saveRecord(dateStr, state.ara.dayIdx, state.ara.slotId, absentVal, finalAssign, halfVal);
    state.ara.hasRecord = true;
    state.ara.assignments = finalAssign;
    state.ara.absent = absentVal;
    state.ara.halfMode = halfVal;
    state.ara._loadedHalf = halfVal;
    document.getElementById('ara-savedflag').textContent = 'Desat ✓';
    renderAra();
  });
  const delBtn = document.getElementById('ara-delete');
  if(delBtn){
    delBtn.addEventListener('click', async ()=>{
      if(!confirm('Vols esborrar aquest registre? Es descomptaran les hores dels professors implicats.')) return;
      await deleteRecord(dateStr, state.ara.slotId);
      state.ara.hasRecord = false;
      state.ara.assignments = null;
      state.ara.absent = 0;
      state.ara.halfMode = false;
      renderAra();
    });
  }

  if(state.ara.hasRecord && assignments){
    state.ara._loadedHalf = state.ara.halfMode;
    const totals = effectiveTotalsExcluding(dateStr, state.ara.slotId, {assignments, half: state.ara.halfMode});
    if(state.ara.halfMode){
      const counts1 = {guardia:0, sala:0, passadis:0}, counts2 = {guardia:0, sala:0, passadis:0};
      Object.values(assignments).forEach(p=>{ if(p.a) counts1[p.a]++; if(p.b) counts2[p.b]++; });
      renderAssignTable(pool, assignments, totals, null, true, counts1, counts2);
    } else {
      const counts = {guardia:0, sala:0, passadis:0};
      Object.values(assignments).forEach(t=>counts[t]=(counts[t]||0)+1);
      renderAssignTable(pool, assignments, totals, counts, false);
    }
  }
}

  if(!wrap) return;
  const taskOptions = (val)=> `

    <option value="passadis" ${val==='passadis'?'selected':''}>Passadís</option>
    <option value="absent" ${val==='absent'?'selected':''}>Absent</option>`;

  if(half){
    wrap.innerHTML = `
      <div class="counts">1a mitja hora — <b>Guàrdia: ${counts1.guardia}</b> · <b>Sala: ${counts1.sala}</b> · <b>Passadís: ${counts1.passadis}</b>
        &nbsp;·&nbsp; 2a mitja hora — <b>Guàrdia: ${counts2.guardia}</b> · <b>Sala: ${counts2.sala}</b> · <b>Passadís: ${counts2.passadis}</b></div>
      <table class="assign">
        <tr><th>Professor</th><th>Hores acum. (G / S / P)</th><th>1a mitja hora</th><th>2a mitja hora</th></tr>
        ${pool.map(name=>{
          const t = totalsForDisplay[name] || {guardia:0,sala:0,passadis:0};
          const parts = assignments[name] || {a:'passadis', b:'passadis'};
          return `<tr data-name="${name}">
            <td>${name}</td>
            <td class="hrs">${t.guardia} / ${t.sala} / ${t.passadis}</td>
            <td><select class="taskpick-a taskpick ${parts.a}" onchange="this.className='taskpick-a taskpick '+this.value">${taskOptions(parts.a)}</select></td>
            <td><select class="taskpick-b taskpick ${parts.b}" onchange="this.className='taskpick-b taskpick '+this.value">${taskOptions(parts.b)}</select></td>
          </tr>`;
        }).join('')}
      </table>
    `;
    return;
  }

  wrap.innerHTML = `
    <div class="counts">Repartiment proposat — <b>Guàrdia: ${counts.guardia}</b> · <b>Sala: ${counts.sala}</b> · <b>Passadís: ${counts.passadis}</b></div>
    <table class="assign">
      <tr><th>Professor</th><th>Hores acumulades (G / S / P)</th><th>Tasca</th></tr>
      ${pool.map(name=>{
        const t = totalsForDisplay[name] || {guardia:0,sala:0,passadis:0};
        const val = assignments[name] || 'passadis';
        return `<tr>
          <td>${name}</td>
          <td class="hrs">${t.guardia} / ${t.sala} / ${t.passadis}</td>
          <td>
            <select class="taskpick ${val}" data-name="${name}" onchange="this.className='taskpick '+this.value">
              ${taskOptions(val)}
            </select>
          </td>
        </tr>`;
      }).join('')}
    </table>
  `;
}

// ----- Tab: Totals -----
function renderTotals(){
  const panel = document.getElementById('panel-totals');
  const totals = state.totals || {};
  let rows = Object.entries(totals).map(([name,t])=>{
    const tot = t.guardia+t.sala+t.passadis;
    const pctG = tot>0? Math.round(t.guardia/tot*100) : 0;
    const pctS = tot>0? Math.round(t.sala/tot*100) : 0;
    const pctP = tot>0? Math.round(t.passadis/tot*100) : 0;
    const mx = Math.max(pctG,pctS,pctP);
    const mn = Math.min(pctG,pctS,pctP);
    return {name, ...t, total: tot, pctG, pctS, pctP, desequilibri: tot>0? (mx-mn) : 0};
  });
  rows.sort((a,b)=> b.desequilibri - a.desequilibri || a.name.localeCompare(b.name,'ca'));

  panel.innerHTML = `
    <div class="card">
      <p style="font-size:12.5px;color:#4a5c6e;margin-top:0;">Les hores de «Guàrdia» inclouen els encàrrecs de servei. El repartiment prioritza segons el % de cada professor, no les hores absolutes — així ningú queda penalitzat per haver estat absent (baixa, permís...) durant un temps.</p>
      ${rows.length===0? '<p class="pool-empty">Encara no hi ha cap guàrdia registrada.</p>' : `
      <table class="totals">
        <tr><th>Professor</th><th>Guàrdia (h)</th><th>Sala (h)</th><th>Passadís (h)</th><th>Total h</th><th>% G / S / P</th><th>Desequilibri</th></tr>
        ${rows.map(r=>`
          <tr>
            <td>${r.name}</td>
            <td>${r.guardia}</td>
            <td>${r.sala}</td>
            <td>${r.passadis}</td>
            <td>${r.total}</td>
            <td>${r.pctG}% / ${r.pctS}% / ${r.pctP}%</td>
            <td>${r.desequilibri} pts</td>
          </tr>
        `).join('')}
      </table>`}
    </div>
  `;
}

          <tr>
            <td class="slotcell">${s.label}</td>
            ${DAY_CODES.map(c=>`<td><textarea data-day="${c}" data-slot="${s.id}">${(draft[c]&&draft[c][s.id]||[]).join(', ')}</textarea></td>`).join('')}
          </tr>
        `).join('')}
      </table>
      <div class="row" style="margin-top:14px;">
        <button class="btn" id="cfg-save">Desar plantilla</button>
        <button class="btn secondary" id="cfg-reset">Restaurar plantilla original</button>
        <span class="saved-flag" id="cfg-savedflag"></span>
      </div>
    </div>
  `;
  panel.querySelector('#cfg-save').addEventListener('click', async ()=>{
    const newTemplate = {};
    DAY_CODES.forEach(c=> newTemplate[c] = {});
    panel.querySelectorAll('textarea').forEach(ta=>{
      const names = ta.value.split(',').map(s=>s.trim()).filter(Boolean);
      newTemplate[ta.dataset.day][ta.dataset.slot] = names;
    });
    state.template = newTemplate;
    state.cfg.draft = JSON.parse(JSON.stringify(newTemplate));
    await safeSet('template', JSON.stringify(newTemplate));
    document.getElementById('cfg-savedflag').textContent = 'Desat ✓';
  });
  panel.querySelector('#cfg-reset').addEventListener('click', async ()=>{
    if(!confirm('Vols restaurar la plantilla original del curs? Es perdran els canvis manuals fets a la configuració.')) return;
    state.template = JSON.parse(JSON.stringify(DEFAULT_TEMPLATE));
    state.cfg.draft = JSON.parse(JSON.stringify(DEFAULT_TEMPLATE));
    await safeSet('template', JSON.stringify(state.template));
    renderConfig();
  });
}

init();
setInterval(updateClock, 30000);
})();
</script>
</body>
</html>
